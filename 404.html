<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nixon Chicken | Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:ital,wght@0,900;1,700&family=Lora:ital@1&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #1a1a1a;
            color: #FDFBF7;
            font-family: 'Inter', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .error-frame {
            border: 2px solid #c8102e;
            max-width: 640px;
            width: 100%;
            padding: 3rem 2.5rem;
            position: relative;
        }

        .error-frame::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 1px solid rgba(200, 16, 46, 0.3);
            pointer-events: none;
        }

        .error-kicker {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #c8102e;
            margin-bottom: 1.5rem;
            display: block;
        }

        .logo {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 900;
            font-size: 2.8rem;
            text-transform: uppercase;
            color: #c8102e;
            line-height: 1;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .error-rule {
            border: none;
            border-top: 3px solid #c8102e;
            margin: 1.5rem 0;
        }

        .error-number {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(253,251,247,0.4);
            margin-bottom: 2rem;
        }

        .error-message {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 900;
            font-style: italic;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            line-height: 1.2;
            color: #FDFBF7;
            min-height: 3em;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .error-sub {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 0.95rem;
            color: rgba(253,251,247,0.5);
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .back-link {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #FDFBF7;
            text-decoration: none;
            border: 1px solid rgba(253,251,247,0.3);
            padding: 0.6rem 1.4rem;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .back-link:hover {
            background: rgba(253,251,247,0.08);
            border-color: rgba(253,251,247,0.6);
        }

        .error-footer {
            margin-top: 3rem;
            font-size: 0.65rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(253,251,247,0.2);
        }
    </style>
</head>
<body>

    <div class="error-frame">
        <div class="logo">Nixon Chicken</div>
        <hr class="error-rule">
        <div class="error-number">Error 404 &mdash; Page Not Located &mdash; We Are Looking Into It</div>

        <div class="error-message" id="error-msg">Loading&hellip;</div>

        <p class="error-sub">
            This page has been reviewed by our legal team, our editorial board,<br>
            and a rotating panel of concerned birds. No one is talking.
        </p>

        <a href="/" class="back-link">&larr; Return to Nixon Chicken</a>
    </div>

    <p class="error-footer">&copy; 2026 Nixon Chicken Magazine.</p>

    <script>
        const messages = [
            "Sued by everyone. BRB.",
            "We\u2019re looking into it. We\u2019re not looking into it.",
            "Our intern did this. Cash him outside.",
            "Under review by mystery committee.",
            "You do this to yourself.",
            "This is your fault somehow.",
            "Bold move. Genuinely.",
            "CLASSIFIED. Also this page doesn\u2019t exist. Also you\u2019re not here.",
            "Redacted by persons unknown for reasons unknown on a date we can\u2019t confirm.",
            "This content has been removed for your safety and our convenience.",
            "Check back never.",
            "Some things are better left unwritten. This is one of those things. Probably.",
            "Recipe available upon request. Request denied.",
            "The chicken crossed the road. We can\u2019t tell you why."
        ];

        const el = document.getElementById('error-msg');
        el.textContent = messages[Math.floor(Math.random() * messages.length)];
    </script>

</body>
</html>
